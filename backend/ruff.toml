# Ruff configuration for CareerPilot backend
# Goal: only catch real bugs. Skip style nitpicks so CI stays green.

target-version = "py312"
line-length = 100

[lint]
# Rules that catch real bugs — keep these enabled
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (undefined names, unused imports)
    "W",    # pycodestyle warnings
    "B",    # bugbear (real bugs only — we'll pick selectively)
    "UP",   # pyupgrade (helpful modernization)
]

# Disable noisy rules that don't indicate real bugs
ignore = [
    "E501",    # line too long (formatter's job)
    "I001",    # import sorting (formatter's job)
    "F401",    # imported but unused (handled by IDE)
    "F841",    # local variable assigned but never used
    "UP037",   # quoted type annotations — fine in modern Python
    "B008",    # FastAPI Depends() in defaults — this IS the FastAPI pattern
    "BLE001",  # blind except Exception — intentional in scrapers/adapters
    "DTZ005",  # datetime.now() without tz
    "DTZ011",  # date.today()
    "FURB167", # re.I alias
    "S110",    # try-except-pass
    "SIM114",  # combine if branches
    "PLR1711", # useless return
    "PLR1730", # if → min()
    "RUF012",  # mutable class default
    "RUF023",  # __slots__ sort
    "RUF100",  # unused noqa
    "RET501",  # explicit return None
    "TRY002",  # create own exception
    "E402",    # module-level import not at top (used in alembic env)
]

[lint.per-file-ignores]
"tests/*" = ["ARG", "PLR2004", "S101", "F401", "F841"]
"alembic/*" = ["E402", "F401"]
"alembic/versions/*" = ["E402", "F401", "I001"]