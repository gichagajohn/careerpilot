name: Discovery agents

# Runs the discovery pipeline against the deployed API so the dashboard keeps
# filling up without the backend needing to stay awake. The first request also
# wakes a sleeping Render free service.
#
# Sources are run ONE AT A TIME. A full sweep can take several minutes, and
# hosting proxies (Render included) kill HTTP requests at ~100 seconds,
# returning a plain-text "upstream request timeout" that is not JSON. Splitting
# the sweep keeps each request short. If one still times out, the backend
# carries on processing it server-side, so we log a warning and continue
# instead of failing the whole run.
#
# Times are UTC. Nairobi is UTC+3:
#   05:00 UTC = 08:00 EAT | 13:00 UTC = 16:00 EAT | 21:00 UTC = 00:00 EAT
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   API_BASE_URL   e.g. https://careerpilot-api.onrender.com   (no trailing slash)
#   API_EMAIL      the account the agents run as
#   API_PASSWORD   that account's password

on:
  schedule:
    - cron: "0 5,13,21 * * *"
  workflow_dispatch:
    inputs:
      scholarships:
        description: "Also run ScholarshipScout (slower)"
        type: boolean
        default: true

concurrency:
  group: discovery
  cancel-in-progress: false

jobs:
  discover:
    name: Run discovery pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      BASE: ${{ secrets.API_BASE_URL }}
      JOB_SOURCES: "remotive remoteok arbeitnow adzuna websearch rss"
      SCHOLARSHIP_SOURCES: >-
        websearch rss scholarship_daad scholarship_erasmus_mundus
        scholarship_chevening scholarship_commonwealth scholarship_mastercard
        scholarship_aims scholarship_mandela_rhodes scholarship_fulbright
        scholarship_gates_cambridge scholarship_pages

    steps:
      - name: Check secrets are configured
        run: |
          missing=0
          [ -n "${{ secrets.API_BASE_URL }}" ] || { echo "::error::Missing secret: API_BASE_URL"; missing=1; }
          [ -n "${{ secrets.API_EMAIL }}" ]    || { echo "::error::Missing secret: API_EMAIL"; missing=1; }
          [ -n "${{ secrets.API_PASSWORD }}" ] || { echo "::error::Missing secret: API_PASSWORD"; missing=1; }
          [ "$missing" -eq 0 ] || exit 1

      - name: Wake the API and wait for it to be healthy
        run: |
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$BASE/health" || true)
            if [ "$code" = "200" ]; then echo "API healthy after ${attempt} attempt(s)"; exit 0; fi
            echo "attempt ${attempt}: /health returned ${code:-no response}; retrying in 10s"
            sleep 10
          done
          echo "::error::API never became healthy at $BASE/health"
          exit 1

      - name: Log in
        env:
          EMAIL: ${{ secrets.API_EMAIL }}
          PASSWORD: ${{ secrets.API_PASSWORD }}
        run: |
          payload=$(jq -nc --arg e "$EMAIL" --arg p "$PASSWORD" '{email:$e,password:$p}')
          body=$(curl -s --max-time 60 -X POST "$BASE/api/v1/auth/login" \
                   -H 'Content-Type: application/json' -d "$payload")
          token=$(printf '%s' "$body" | jq -r '.access_token // empty' 2>/dev/null || true)
          if [ -z "$token" ]; then
            # Never print the body: it may echo back credentials.
            echo "::error::Login failed. Check API_EMAIL / API_PASSWORD."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "TOKEN=$token" >> "$GITHUB_ENV"

      - name: JobScout (one source at a time)
        id: jobscout
        run: |
          total_new=0; total_listings=0; ran=0; timed_out=""
          for src in $JOB_SOURCES; do
            echo "::group::jobscout — $src"
            body=$(curl -s --max-time 600 -X POST \
                     "$BASE/api/v1/agents/jobscout/run?force=true&sources=$src" \
                     -H "Authorization: Bearer $TOKEN" || true)
            if printf '%s' "$body" | jq -e . >/dev/null 2>&1; then
              printf '%s' "$body" | jq .
              total_new=$((total_new + $(printf '%s' "$body" | jq -r '.new_jobs // 0')))
              total_listings=$((total_listings + $(printf '%s' "$body" | jq -r '.listings // 0')))
              ran=$((ran + $(printf '%s' "$body" | jq -r '.sources_run // 0')))
            else
              # Almost always the proxy's ~100s cap. The backend keeps going.
              echo "non-JSON response (likely a proxy timeout); continuing"
              echo "${body:0:200}"
              timed_out="$timed_out $src"
            fi
            echo "::endgroup::"
          done
          [ -n "$timed_out" ] && echo "::warning::Timed out at the proxy (work may still have completed):$timed_out"
          if [ "$ran" = "0" ] && [ -z "$timed_out" ]; then
            echo "::warning::No sources ran — the deployed backend may have no discovery sources."
          fi
          echo "new_jobs=$total_new"     >> "$GITHUB_OUTPUT"
          echo "listings=$total_listings" >> "$GITHUB_OUTPUT"
          echo "sources=$ran"            >> "$GITHUB_OUTPUT"

      - name: ScholarshipScout (one source at a time)
        id: scholarships
        if: github.event_name == 'schedule' || inputs.scholarships
        run: |
          total_new=0; timed_out=""
          for src in $SCHOLARSHIP_SOURCES; do
            echo "::group::scholarshipscout — $src"
            body=$(curl -s --max-time 600 -X POST \
                     "$BASE/api/v1/agents/scholarshipscout/run?force=true&sources=$src" \
                     -H "Authorization: Bearer $TOKEN" || true)
            if printf '%s' "$body" | jq -e . >/dev/null 2>&1; then
              printf '%s' "$body" | jq .
              total_new=$((total_new + $(printf '%s' "$body" | jq -r '.new_scholarships // 0')))
            else
              echo "non-JSON response (likely a proxy timeout); continuing"
              timed_out="$timed_out $src"
            fi
            echo "::endgroup::"
          done
          [ -n "$timed_out" ] && echo "::warning::Timed out at the proxy:$timed_out"
          echo "new=$total_new" >> "$GITHUB_OUTPUT"

      - name: Verify
        continue-on-error: true
        run: |
          body=$(curl -s --max-time 900 -X POST "$BASE/api/v1/agents/verify/run" \
                   -H "Authorization: Bearer $TOKEN" || true)
          printf '%s' "$body" | jq . || echo "non-JSON response; continuing"

      - name: Match against the master profile
        id: matcher
        run: |
          body=$(curl -s --max-time 900 -X POST "$BASE/api/v1/agents/matcher/run?force=true" \
                   -H "Authorization: Bearer $TOKEN" || true)
          if printf '%s' "$body" | jq -e . >/dev/null 2>&1; then
            printf '%s' "$body" | jq .
            errs=$(printf '%s' "$body" | jq -r '.errors | length')
            [ "$errs" != "0" ] && echo "::warning::Matcher: $(printf '%s' "$body" | jq -r '.errors | join("; ")')"
            echo "jobs=$(printf '%s' "$body" | jq -r '.jobs_scored // 0')"          >> "$GITHUB_OUTPUT"
            echo "schol=$(printf '%s' "$body" | jq -r '.scholarships_scored // 0')" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Matcher returned a non-JSON response (likely a proxy timeout)."
            echo "jobs=?"  >> "$GITHUB_OUTPUT"
            echo "schol=?" >> "$GITHUB_OUTPUT"
          fi

      - name: Dashboard totals
        id: dash
        if: always()
        run: |
          body=$(curl -s --max-time 120 "$BASE/api/v1/dashboard/summary" \
                   -H "Authorization: Bearer $TOKEN" || true)
          if printf '%s' "$body" | jq -e . >/dev/null 2>&1; then
            printf '%s' "$body" | jq -c '{total_opportunities,new_opportunities,high_match_opportunities,scholarships_total}'
            echo "total=$(printf '%s' "$body" | jq -r '.total_opportunities // 0')"      >> "$GITHUB_OUTPUT"
            echo "high=$(printf '%s' "$body"  | jq -r '.high_match_opportunities // 0')" >> "$GITHUB_OUTPUT"
            echo "schol=$(printf '%s' "$body" | jq -r '.scholarships_total // 0')"       >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Discovery run"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Sources run | ${{ steps.jobscout.outputs.sources }} |"
            echo "| Listings seen | ${{ steps.jobscout.outputs.listings }} |"
            echo "| New jobs | ${{ steps.jobscout.outputs.new_jobs }} |"
            echo "| New scholarships | ${{ steps.scholarships.outputs.new }} |"
            echo "| Scored (jobs / scholarships) | ${{ steps.matcher.outputs.jobs }} / ${{ steps.matcher.outputs.schol }} |"
            echo "| **Dashboard total** | **${{ steps.dash.outputs.total }}** |"
            echo "| Dashboard high match | ${{ steps.dash.outputs.high }} |"
            echo "| Dashboard scholarships | ${{ steps.dash.outputs.schol }} |"
          } >> "$GITHUB_STEP_SUMMARY"
